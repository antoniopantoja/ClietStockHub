version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: csh-postgres
    restart: always
    environment:
      POSTGRES_USER: csh_user
      POSTGRES_PASSWORD: csh_pass
      POSTGRES_DB: csh_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
